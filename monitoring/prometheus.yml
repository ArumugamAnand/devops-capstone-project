global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus monitoring itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # EC2 host-level metrics (CPU, memory, disk, network)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  # Application-level metrics from the Node.js app's /metrics endpoint
  # Replace 'app' with the container name or host:port reachable from this box
  - job_name: 'devops-capstone-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']
