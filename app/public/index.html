<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevOps Capstone App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 3rem;
    max-width: 560px;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
  p.sub { color: #94a3b8; margin-bottom: 1.5rem; }
  .badge {
    display: inline-block;
    background: #22c55e;
    color: #052e16;
    font-weight: 600;
    font-size: 0.8rem;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    margin-bottom: 1.5rem;
  }
  .links a {
    display: inline-block;
    margin: 0.4rem;
    padding: 0.6rem 1.1rem;
    border-radius: 8px;
    background: #334155;
    color: #e2e8f0;
    text-decoration: none;
    font-size: 0.9rem;
  }
  .links a:hover { background: #475569; }
  footer { margin-top: 1.5rem; font-size: 0.75rem; color: #64748b; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">● Running</div>
    <h1>DevOps Capstone App</h1>
    <p class="sub">Deployed via GitHub → Jenkins → Docker → AWS EC2 pipeline</p>
    <div class="links">
      <a href="/api/info">/api/info</a>
      <a href="/health">/health</a>
      <a href="/metrics">/metrics</a>
    </div>
    <footer>Node.js + Express · Containerized with Docker · Monitored with Prometheus &amp; Grafana</footer>
  </div>
</body>
</html>
